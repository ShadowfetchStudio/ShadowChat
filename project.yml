name: ShadowChat
options:
  bundleIdPrefix: com.shadowfetch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_TESTABILITY: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
targets:
  ShadowChat:
    type: application
    platform: macOS
    sources:
      - path: ShadowChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shadowfetch.shadowchat
        PRODUCT_NAME: ShadowChat
        PRODUCT_MODULE_NAME: ShadowChat
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShadowChat/Info.plist
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lsqlite3"]
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
  ShadowChatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShadowChatTests
    dependencies:
      - target: ShadowChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: ShadowChatTests
        PRODUCT_BUNDLE_IDENTIFIER: com.shadowfetch.shadowchat.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShadowChat.app/Contents/MacOS/ShadowChat"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: ["-lsqlite3"]
schemes:
  ShadowChat:
    build:
      targets:
        ShadowChat: all
        ShadowChatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShadowChatTests
